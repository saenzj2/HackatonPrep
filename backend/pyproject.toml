[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardians-backend"
version = "0.1.0"
description = "Guardians of the Harvest — crop rotation decision support backend (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff==0.17.4",  # keep in sync with .pre-commit-config.yaml
    "pre-commit>=3.7",
    "openapi-spec-validator>=0.7",
    "respx>=0.21",
    "mypy==1.18.2",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Each code is a rule family; see https://docs.astral.sh/ruff/rules/
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # import sorting
    "N",       # pep8 naming
    "UP",      # modern syntax for our Python version
    "B",       # bugbear: likely bugs (mutable defaults, loop closures…)
    "SIM",     # simplifications
    "C4",      # comprehensions
    "RET",     # return statements
    "PTH",     # pathlib instead of os.path
    "DTZ",     # timezone-aware datetimes only
    "T20",     # no print(): use logging
    "ANN",     # type annotations on functions
    "PT",      # pytest style
    "PL",      # pylint subset
    "RUF",     # ruff-specific
    # Error handling (docs/errors.md)
    "BLE",     # no blind `except Exception`
    "TRY",     # tryceratops: raise/except anti-patterns
    "S101",    # no `assert` for runtime checks in app code
    "S110",    # no try/except/pass
    "S112",    # no try/except/continue
    "G",       # logging: no f-strings or .format() in log calls
    "LOG",     # logging: correct logger usage
]
ignore = [
    "PLR2004",  # magic numbers: thresholds read better inline in domain code
    "PLR0913",  # too many arguments: domain functions take explicit inputs on purpose
    "ANN401",   # Any is allowed for raw JSON payloads
    "RUF001",   # ambiguous unicode in strings: we use °, ³, → on purpose
    "RUF002",   # same, in docstrings
    "RUF003",   # same, in comments
    "TRY003",   # long messages at raise site: our messages are specific on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101", "TRY"]
"app/api/errors.py" = ["BLE001"]  # the last-resort handler is the one place allowed to catch all

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true


# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than ~1s (excluded from `make test`)",
    "network: tests that call real external APIs (excluded from `make test` and CI)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Upstream starlette notice about its test client; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient`",
]
