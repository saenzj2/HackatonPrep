# API contract (OpenAPI 3.1). Hand-maintained. See info.description.
openapi: 3.1.0
info:
  title: Guardians of the Harvest API
  description: '**DRAFT v0** — contract between backend and frontend. To be reviewed with the frontend.


    This file is the source of truth: change it first, agree on it, then change the code.

    `tests/test_contract.py` fails CI if the running app and this file disagree.


    Errors: every 4xx/5xx returns ErrorResponse `{"error": {code, message, details, request_id}}`. Switch
    on `code` (ErrorCode enum). Full table: backend/docs/errors.md.

    Units: temperature °C, rainfall mm, soil moisture m³/m³, scores 0..1 (1 = ideal).

    Local server: http://localhost:8000 (interactive docs at /docs).'
  version: 0.2.0-draft
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      description: Liveness check plus the active data mode and MVP region.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /crops:
    get:
      tags:
      - crops
      summary: List Crops
      description: Crops in the MVP scope, with their tolerance ranges.
      operationId: list_crops_crops_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropsResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /conditions:
    get:
      tags:
      - conditions
      summary: Get Conditions
      description: Monthly climate normals, per-season summary and soil at a point.
      operationId: get_conditions_conditions_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 10.0
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -84.2
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conditions'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`, `invalid_rotation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recommendations:
    post:
      tags:
      - recommendations
      summary: Create Recommendation
      description: Rank crop rotations for a location given the farmer's priorities.
      operationId: create_recommendation_recommendations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`, `invalid_rotation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CategoryBreakdown:
      properties:
        climate:
          anyOf:
          - type: number
          - type: 'null'
          title: Climate
        water:
          anyOf:
          - type: number
          - type: 'null'
          title: Water
        soil:
          anyOf:
          - type: number
          - type: 'null'
          title: Soil
      additionalProperties: false
      type: object
      required:
      - climate
      - water
      - soil
      title: CategoryBreakdown
    Conditions:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        monthly:
          items:
            $ref: '#/components/schemas/MonthClimate'
          type: array
          title: Monthly
        seasons:
          items:
            $ref: '#/components/schemas/SeasonSummary'
          type: array
          title: Seasons
        soil:
          $ref: '#/components/schemas/Soil'
        data_sources:
          $ref: '#/components/schemas/DataSources'
      additionalProperties: false
      type: object
      required:
      - location
      - monthly
      - seasons
      - soil
      - data_sources
      title: Conditions
    Crop:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        scientific_name:
          type: string
          title: Scientific Name
        family:
          type: string
          title: Family
        is_legume:
          type: boolean
          title: Is Legume
        cycle_days:
          type: integer
          title: Cycle Days
        temperature_c:
          $ref: '#/components/schemas/ToleranceRange'
        rainfall_mm:
          $ref: '#/components/schemas/ToleranceRange'
          description: Total rainfall over the crop cycle
        soil_ph:
          $ref: '#/components/schemas/ToleranceRange'
        root_depth_m:
          type: number
          title: Root Depth M
          description: Typical maximum effective rooting depth, m
        is_cover_crop:
          type: boolean
          title: Is Cover Crop
          description: Commonly grown to cover and protect the soil
        forage_value:
          $ref: '#/components/schemas/TraitValue'
          description: Value of the crop or its residue as animal feed
        nutrition_density:
          $ref: '#/components/schemas/TraitValue'
          description: Nutrient density of the edible part
        mycorrhizal_affinity:
          $ref: '#/components/schemas/TraitValue'
          description: 'How much the crop hosts and benefits from mycorrhizal fungi; none = non-host'
        nitrogen_demand:
          $ref: '#/components/schemas/TraitValue'
          description: 'Nitrogen need; high = heavy feeder'
        market_note:
          type: string
          title: Market Note
          description: 'One line of local market context; may be empty'
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Citations for this crop's values
        verified:
          type: boolean
          title: Verified
          description: False while values are still approximate
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - scientific_name
      - family
      - is_legume
      - cycle_days
      - temperature_c
      - rainfall_mm
      - soil_ph
      - root_depth_m
      - is_cover_crop
      - forage_value
      - nutrition_density
      - mycorrhizal_affinity
      - nitrogen_demand
      - market_note
      - sources
      - verified
      title: Crop
    CropsResponse:
      properties:
        crops:
          items:
            $ref: '#/components/schemas/Crop'
          type: array
          title: Crops
      additionalProperties: false
      type: object
      required:
      - crops
      title: CropsResponse
    DataSources:
      properties:
        climate:
          type: string
          title: Climate
        soil:
          type: string
          title: Soil
        crops:
          type: string
          title: Crops
      additionalProperties: false
      type: object
      required:
      - climate
      - soil
      - crops
      title: DataSources
    ErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable machine-readable code. Switch on this.
        message:
          type: string
          title: Message
          description: Plain-English explanation, safe to show to users
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Machine-readable context; keys depend on the code
        request_id:
          type: string
          title: Request Id
          description: Same as the X-Request-ID header; quote it in bug reports
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorBody
    ErrorCode:
      type: string
      enum:
      - validation_failed
      - out_of_region
      - unknown_crop
      - invalid_priorities
      - invalid_rotation
      - not_found
      - method_not_allowed
      - http_error
      - source_unavailable
      - source_bad_data
      - cache_miss
      - config_invalid
      - domain_invariant
      - internal_error
      title: ErrorCode
      description: Stable machine-readable codes. New code = new class + docs/errors.md row + contract
        enum.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      description: Envelope for EVERY error response (4xx and 5xx). See backend/docs/errors.md.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        data_mode:
          type: string
          title: Data Mode
        region:
          $ref: '#/components/schemas/Region'
      additionalProperties: false
      type: object
      required:
      - status
      - version
      - data_mode
      - region
      title: HealthResponse
    Location:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - 10.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - -84.2
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      title: Location
      description: One representative point (decimal degrees). Values are for it, never an area average.
    MonthClimate:
      properties:
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        temperature_c:
          type: number
          title: Temperature C
        rainfall_mm:
          type: number
          title: Rainfall Mm
        temperature_max_c:
          type: number
          title: Temperature Max C
          description: Mean of the daily maximum temperature, °C
        temperature_min_c:
          type: number
          title: Temperature Min C
          description: Mean of the daily minimum temperature, °C
      additionalProperties: false
      type: object
      required:
      - month
      - temperature_c
      - rainfall_mm
      - temperature_max_c
      - temperature_min_c
      title: MonthClimate
    Priorities:
      properties:
        water:
          type: number
          minimum: 0.0
          title: Water
          examples:
          - 0.4
        soil:
          type: number
          minimum: 0.0
          title: Soil
          examples:
          - 0.3
        climate:
          type: number
          minimum: 0.0
          title: Climate
          examples:
          - 0.3
      additionalProperties: false
      type: object
      required:
      - water
      - soil
      - climate
      title: Priorities
    RecommendationRequest:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: 'Latitude of one representative point. For a selected area, send one explicitly chosen point;
            results are for that point, never an area or polygon average.'
          examples:
          - 10.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          description: 'Longitude of one representative point. For a selected area, send one explicitly chosen point;
            results are for that point, never an area or polygon average.'
          examples:
          - -84.2
        crops:
          anyOf:
          - items:
              type: string
            type: array
            minItems: 1
          - type: 'null'
          title: Crops
          description: 'Crop ids from GET /crops. Omit for the MVP crops; an empty list is invalid. Ids
            not in GET /crops fail with unknown_crop; they are never substituted.'
        priorities:
          anyOf:
          - $ref: '#/components/schemas/Priorities'
          - type: 'null'
          description: 'Relative importance; normalized to sum 1. Default: MVP weights.'
        top_n:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Top N
        current_rotation:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Current Rotation
          description: 'The farmer''s current rotation: crop ids from GET /crops, one per season, in the
            order of conditions.seasons. Scored as the baseline the other rotations compare to. Omit when
            there is no current crop: no baseline, so current_rotation and score_delta_vs_current are null.
            Ids not in GET /crops fail with unknown_crop; they are never substituted.'
          examples:
          - - maize
            - maize
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      title: RecommendationRequest
    RecommendationResponse:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        region:
          $ref: '#/components/schemas/Region'
        priorities:
          $ref: '#/components/schemas/Priorities'
        conditions:
          $ref: '#/components/schemas/Conditions'
        rotations:
          items:
            $ref: '#/components/schemas/Rotation'
          type: array
          title: Rotations
        current_rotation:
          anyOf:
          - $ref: '#/components/schemas/Rotation'
          - type: 'null'
          description: The farmer's rotation scored the same way; rank is its position among all combinations
            (can be greater than top_n). Null without current_rotation.
        method_version:
          type: string
          title: Method Version
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - location
      - region
      - priorities
      - conditions
      - rotations
      - current_rotation
      - method_version
      - generated_at
      title: RecommendationResponse
    Region:
      properties:
        name:
          type: string
          title: Name
        bbox:
          items:
            type: number
          type: array
          title: Bbox
          description: '[min_lon, min_lat, max_lon, max_lat]'
      additionalProperties: false
      type: object
      required:
      - name
      - bbox
      title: Region
    Rotation:
      properties:
        rank:
          type: integer
          title: Rank
        sequence:
          items:
            $ref: '#/components/schemas/RotationStep'
          type: array
          title: Sequence
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        viable:
          type: boolean
          title: Viable
        breakdown:
          $ref: '#/components/schemas/CategoryBreakdown'
        explanation:
          type: string
          title: Explanation
        is_current:
          type: boolean
          title: Is Current
          description: True if this is the farmer's current_rotation
        score_delta_vs_current:
          anyOf:
          - type: number
          - type: 'null'
          title: Score Delta Vs Current
          description: score minus the current rotation's score; null without current_rotation
        benefits:
          items:
            type: string
          type: array
          title: Benefits
          description: Why this rotation helps (soil, pests, fit)
        risks:
          items:
            type: string
          type: array
          title: Risks
          description: What could go wrong; check locally before acting
        data_gaps:
          items:
            type: string
          type: array
          title: Data Gaps
          description: Missing or approximate data behind this result
        evidence:
          items:
            type: string
          type: array
          title: Evidence
          description: The data values the score is based on, with sources
        notes:
          items:
            type: string
          type: array
          title: Notes
          description: 'Deprecated: benefits + risks. Use those instead.'
      additionalProperties: false
      type: object
      required:
      - rank
      - sequence
      - score
      - viable
      - breakdown
      - explanation
      - is_current
      - score_delta_vs_current
      - benefits
      - risks
      - data_gaps
      - evidence
      - notes
      title: Rotation
    RotationStep:
      properties:
        season:
          type: string
          title: Season
        months:
          items:
            type: integer
          type: array
          title: Months
        crop_id:
          type: string
          title: Crop Id
        crop_name:
          type: string
          title: Crop Name
        score:
          type: number
          title: Score
        variable_scores:
          additionalProperties:
            type: number
          type: object
          title: Variable Scores
      additionalProperties: false
      type: object
      required:
      - season
      - months
      - crop_id
      - crop_name
      - score
      - variable_scores
      title: RotationStep
    SeasonSummary:
      properties:
        name:
          type: string
          title: Name
        months:
          items:
            type: integer
          type: array
          title: Months
        temperature_c:
          type: number
          title: Temperature C
        rainfall_mm_per_month:
          type: number
          title: Rainfall Mm Per Month
        temperature_max_c:
          type: number
          title: Temperature Max C
          description: Mean daily maximum temperature over the season, °C (heat stress)
        temperature_min_c:
          type: number
          title: Temperature Min C
          description: Mean daily minimum of the season's coldest month, °C (frost risk)
      additionalProperties: false
      type: object
      required:
      - name
      - months
      - temperature_c
      - rainfall_mm_per_month
      - temperature_max_c
      - temperature_min_c
      title: SeasonSummary
    Soil:
      properties:
        ph:
          type: number
          title: Ph
        moisture_m3m3:
          type: number
          title: Moisture M3M3
      additionalProperties: false
      type: object
      required:
      - ph
      - moisture_m3m3
      title: Soil
    ToleranceRange:
      properties:
        abs_min:
          type: number
          title: Abs Min
        opt_min:
          type: number
          title: Opt Min
        opt_max:
          type: number
          title: Opt Max
        abs_max:
          type: number
          title: Abs Max
      additionalProperties: false
      type: object
      required:
      - abs_min
      - opt_min
      - opt_max
      - abs_max
      title: ToleranceRange
    TraitValue:
      properties:
        level:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          title: Level
          description: Word for the score
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: 0..1, 1 = most
      additionalProperties: false
      type: object
      required:
      - level
      - score
      title: TraitValue
      description: A crop trait as a word for display plus its 0..1 score (e.g. for a hover).
servers:
- url: http://localhost:8000
  description: Local dev (make dev)
