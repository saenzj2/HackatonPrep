# API contract (OpenAPI 3.1). Hand-maintained. See info.description.
openapi: 3.1.0
info:
  title: Guardians of the Harvest API
  description: '**DRAFT v0** — contract between backend and frontend. To be reviewed with the frontend.


    This file is the source of truth: change it first, agree on it, then change the code.

    `tests/test_contract.py` fails CI if the running app and this file disagree.


    Errors: every 4xx/5xx returns ErrorResponse `{"error": {code, message, details, request_id}}`. Switch
    on `code` (ErrorCode enum). Full table: backend/docs/errors.md.

    Units: temperature °C, rainfall mm, soil moisture m³/m³, scores 0..1 (1 = ideal).

    Local server: http://localhost:8000 (interactive docs at /docs).'
  version: 0.2.0-draft
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      description: Liveness check plus the active data mode and MVP region.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /crops:
    get:
      tags:
      - crops
      summary: List Crops
      description: Crops in the MVP scope, with their tolerance ranges.
      operationId: list_crops_crops_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropsResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /conditions:
    get:
      tags:
      - conditions
      summary: Get Conditions
      description: Monthly climate normals, per-season summary and soil at a point.
      operationId: get_conditions_conditions_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 10.0
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -84.2
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conditions'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`, `invalid_rotation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /planting-windows:
    get:
      tags:
      - planting
      summary: Get Planting Windows
      description: 'Best sowing months per crop at a point: each month scored over the crop''s cycle.'
      operationId: get_planting_windows_planting_windows_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 11.0
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -84.6
          title: Lon
      - name: crops
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Crop ids from GET /crops, repeatable. Omit for the MVP crops.
          title: Crops
        description: Crop ids from GET /crops, repeatable. Omit for the MVP crops.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantingWindowsResponse'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`, `invalid_rotation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recommendations:
    post:
      tags:
      - recommendations
      summary: Create Recommendation
      description: Rank crop rotations for a location given the farmer's priorities.
      operationId: create_recommendation_recommendations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`, `invalid_rotation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /plan-risk:
    post:
      tags:
      - plan-risk
      summary: Create Plan Risk
      description: 'Replay a crop + sowing date plan against past years of weather: when could it fail?'
      operationId: create_plan_risk_plan_risk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRiskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRiskResponse'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`, `invalid_rotation`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CategoryBreakdown:
      properties:
        climate:
          anyOf:
          - type: number
          - type: 'null'
          title: Climate
        water:
          anyOf:
          - type: number
          - type: 'null'
          title: Water
        soil:
          anyOf:
          - type: number
          - type: 'null'
          title: Soil
      additionalProperties: false
      type: object
      required:
      - climate
      - water
      - soil
      title: CategoryBreakdown
    Conditions:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        monthly:
          items:
            $ref: '#/components/schemas/MonthClimate'
          type: array
          title: Monthly
        seasons:
          items:
            $ref: '#/components/schemas/SeasonSummary'
          type: array
          title: Seasons
        soil:
          $ref: '#/components/schemas/Soil'
        data_sources:
          $ref: '#/components/schemas/DataSources'
      additionalProperties: false
      type: object
      required:
      - location
      - monthly
      - seasons
      - soil
      - data_sources
      title: Conditions
    Crop:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        name_es:
          type: string
          title: Name Es
          description: Name in Spanish (Costa Rica)
        scientific_name:
          type: string
          title: Scientific Name
        family:
          type: string
          title: Family
        is_legume:
          type: boolean
          title: Is Legume
        cycle_days:
          type: integer
          title: Cycle Days
        temperature_c:
          $ref: '#/components/schemas/ToleranceRange'
        rainfall_mm:
          $ref: '#/components/schemas/ToleranceRange'
          description: Total rainfall over the crop cycle
        soil_ph:
          $ref: '#/components/schemas/ToleranceRange'
        root_depth_m:
          type: number
          title: Root Depth M
          description: Typical maximum effective rooting depth, m
        is_cover_crop:
          type: boolean
          title: Is Cover Crop
          description: Commonly grown to cover and protect the soil
        needs_good_drainage:
          type: boolean
          title: Needs Good Drainage
          description: 'EcoCrop: does not tolerate poorly drained soil (checked for waterlogging)'
        forage_value:
          $ref: '#/components/schemas/TraitValue'
          description: Value of the crop or its residue as animal feed
        nutrition_density:
          $ref: '#/components/schemas/TraitValue'
          description: Nutrient density of the edible part
        mycorrhizal_affinity:
          $ref: '#/components/schemas/TraitValue'
          description: How much the crop hosts and benefits from mycorrhizal fungi; none = non-host
        nitrogen_demand:
          $ref: '#/components/schemas/TraitValue'
          description: Nitrogen need; high = heavy feeder
        market_note:
          type: string
          title: Market Note
          description: One line of local market context; may be empty
        sources:
          items:
            type: string
          type: array
          title: Sources
          description: Citations for this crop's values
        verified:
          type: boolean
          title: Verified
          description: False while values are still approximate
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - name_es
      - scientific_name
      - family
      - is_legume
      - cycle_days
      - temperature_c
      - rainfall_mm
      - soil_ph
      - root_depth_m
      - is_cover_crop
      - needs_good_drainage
      - forage_value
      - nutrition_density
      - mycorrhizal_affinity
      - nitrogen_demand
      - market_note
      - sources
      - verified
      title: Crop
    CropsResponse:
      properties:
        crops:
          items:
            $ref: '#/components/schemas/Crop'
          type: array
          title: Crops
      additionalProperties: false
      type: object
      required:
      - crops
      title: CropsResponse
    DataSources:
      properties:
        climate:
          type: string
          title: Climate
        soil:
          type: string
          title: Soil
        crops:
          type: string
          title: Crops
      additionalProperties: false
      type: object
      required:
      - climate
      - soil
      - crops
      title: DataSources
    EnsoGroup:
      properties:
        years:
          type: integer
          title: Years
          description: Evaluated years in this phase
        failed:
          type: integer
          title: Failed
          description: Of those, years that failed
      additionalProperties: false
      type: object
      required:
      - years
      - failed
      title: EnsoGroup
    EnsoNow:
      properties:
        oni:
          type: number
          title: Oni
          description: Relative Oceanic Niño Index (RONI, NOAA CPC official index since 2026), °C anomaly, latest 3-month season
        phase:
          type: string
          enum:
          - el_nino
          - la_nina
          - neutral
          title: Phase
        season:
          type: string
          title: Season
          description: 3-month ONI season
          examples:
          - ASO 2026
        source:
          type: string
          title: Source
      additionalProperties: false
      type: object
      required:
      - oni
      - phase
      - season
      - source
      title: EnsoNow
    EnsoSplit:
      properties:
        el_nino:
          $ref: '#/components/schemas/EnsoGroup'
        la_nina:
          $ref: '#/components/schemas/EnsoGroup'
        neutral:
          $ref: '#/components/schemas/EnsoGroup'
        note:
          $ref: '#/components/schemas/LocalizedText'
          description: Says when there are too few years to compare
      additionalProperties: false
      type: object
      required:
      - el_nino
      - la_nina
      - neutral
      - note
      title: EnsoSplit
    ErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable machine-readable code. Switch on this.
        message:
          type: string
          title: Message
          description: Plain-English explanation, safe to show to users
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Machine-readable context; keys depend on the code
        request_id:
          type: string
          title: Request Id
          description: Same as the X-Request-ID header; quote it in bug reports
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorBody
    ErrorCode:
      type: string
      enum:
      - validation_failed
      - out_of_region
      - unknown_crop
      - invalid_priorities
      - invalid_rotation
      - not_found
      - method_not_allowed
      - http_error
      - source_unavailable
      - source_bad_data
      - cache_miss
      - config_invalid
      - domain_invariant
      - internal_error
      title: ErrorCode
      description: Stable machine-readable codes. New code = new class + docs/errors.md row + contract
        enum.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      description: Envelope for EVERY error response (4xx and 5xx). See backend/docs/errors.md.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        data_mode:
          type: string
          title: Data Mode
        region:
          $ref: '#/components/schemas/Region'
      additionalProperties: false
      type: object
      required:
      - status
      - version
      - data_mode
      - region
      title: HealthResponse
    Location:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - 10.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - -84.2
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      title: Location
      description: One representative point (decimal degrees). Values are for it, never an area average.
    MonthClimate:
      properties:
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        temperature_c:
          type: number
          title: Temperature C
        rainfall_mm:
          type: number
          title: Rainfall Mm
        temperature_max_c:
          type: number
          title: Temperature Max C
          description: Mean of the daily maximum temperature, °C
        temperature_min_c:
          type: number
          title: Temperature Min C
          description: Mean of the daily minimum temperature, °C
      additionalProperties: false
      type: object
      required:
      - month
      - temperature_c
      - rainfall_mm
      - temperature_max_c
      - temperature_min_c
      title: MonthClimate
    PlanAlternative:
      properties:
        kind:
          type: string
          enum:
          - shift_sowing
          - other_crop
          title: Kind
        crop_id:
          type: string
          title: Crop Id
        sowing_date:
          type: string
          title: Sowing Date
          description: MM-DD
          examples:
          - 08-18
        failed_years:
          type: integer
          title: Failed Years
        failure_rate:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Failure Rate
        label:
          $ref: '#/components/schemas/LocalizedText'
      additionalProperties: false
      type: object
      required:
      - kind
      - crop_id
      - sowing_date
      - failed_years
      - failure_rate
      - label
      title: PlanAlternative
    PlanRiskCause:
      properties:
        cause:
          type: string
          enum:
          - late_dry_start
          - flowering_dry_spell
          - cycle_rain_low
          - cycle_rain_high
          - harvest_wet
          - flowering_heat
          title: Cause
        severity:
          type: string
          enum:
          - fail
          - stress
          title: Severity
          description: Worst severity seen for this cause
        years:
          items:
            type: integer
          type: array
          title: Years
          description: Sowing years in which this cause appeared
        count:
          type: integer
          title: Count
        explanation:
          $ref: '#/components/schemas/LocalizedText'
          description: What happened, with the worst year's numbers
        actions:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Actions
      additionalProperties: false
      type: object
      required:
      - cause
      - severity
      - years
      - count
      - explanation
      - actions
      title: PlanRiskCause
    PlanRiskPlanting:
      properties:
        crop_id:
          type: string
          title: Crop Id
        crop_name:
          $ref: '#/components/schemas/LocalizedText'
        sowing_date:
          type: string
          title: Sowing Date
          description: MM-DD
          examples:
          - 05-15
        harvest_date:
          type: string
          title: Harvest Date
          description: MM-DD, sowing + cycle_days
          examples:
          - 09-12
        failed_years:
          type: integer
          title: Failed Years
        failure_rate:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Failure Rate
          description: failed years / evaluated years
        summary:
          $ref: '#/components/schemas/LocalizedText'
        causes:
          items:
            $ref: '#/components/schemas/PlanRiskCause'
          type: array
          title: Causes
          description: Causes that failed a year first, then by count; only causes seen at least once
        years:
          items:
            $ref: '#/components/schemas/PlanRiskYear'
          type: array
          title: Years
        enso_split:
          anyOf:
          - $ref: '#/components/schemas/EnsoSplit'
          - type: 'null'
          description: Null without ONI data
        alternatives:
          items:
            $ref: '#/components/schemas/PlanAlternative'
          type: array
          title: Alternatives
          description: At most 3, each failing in fewer years than the plan
      additionalProperties: false
      type: object
      required:
      - crop_id
      - crop_name
      - sowing_date
      - harvest_date
      - failed_years
      - failure_rate
      - summary
      - causes
      - years
      - enso_split
      - alternatives
      title: PlanRiskPlanting
    PlanRiskRequest:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: Latitude of one representative point. For a selected area, send one explicitly chosen
            point; results are for that point, never an area or polygon average.
          examples:
          - 11.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          description: Longitude of one representative point. For a selected area, send one explicitly chosen
            point; results are for that point, never an area or polygon average.
          examples:
          - -84.6
        plantings:
          items:
            $ref: '#/components/schemas/PlantingInput'
          type: array
          maxItems: 4
          minItems: 1
          title: Plantings
          description: Each planting is evaluated alone; two plantings return two results.
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      - plantings
      title: PlanRiskRequest
    PlanRiskResponse:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        years_evaluated:
          $ref: '#/components/schemas/YearsEvaluated'
        data_sources:
          items:
            type: string
          type: array
          title: Data Sources
        enso_now:
          anyOf:
          - $ref: '#/components/schemas/EnsoNow'
          - type: 'null'
          description: Null when NOAA ONI data is unavailable
        plantings:
          items:
            $ref: '#/components/schemas/PlanRiskPlanting'
          type: array
          title: Plantings
        data_gaps:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Data Gaps
      additionalProperties: false
      type: object
      required:
      - location
      - years_evaluated
      - data_sources
      - enso_now
      - plantings
      - data_gaps
      title: PlanRiskResponse
    PlanRiskYear:
      properties:
        year:
          type: integer
          title: Year
          description: Sowing year
        outcome:
          type: string
          enum:
          - ok
          - stress
          - fail
          title: Outcome
        causes:
          items:
            type: string
            enum:
            - late_dry_start
            - flowering_dry_spell
            - cycle_rain_low
            - cycle_rain_high
            - harvest_wet
            - flowering_heat
          type: array
          title: Causes
        enso:
          anyOf:
          - type: string
            enum:
            - el_nino
            - la_nina
            - neutral
          - type: 'null'
          title: Enso
          description: ENSO phase of that year; null without ONI data
      additionalProperties: false
      type: object
      required:
      - year
      - outcome
      - causes
      - enso
      title: PlanRiskYear
    PlantingInput:
      properties:
        crop:
          type: string
          title: Crop
          description: Crop id from GET /crops. Ids not in GET /crops fail with unknown_crop; they are never
            substituted.
        sowing_month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Sowing Month
          examples:
          - 5
        sowing_day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Sowing Day
          description: Validated against the month.
          default: 1
          examples:
          - 15
      additionalProperties: false
      type: object
      required:
      - crop
      - sowing_month
      title: PlantingInput
      description: 'One planting to stress-test: a crop and its sowing date (month and day, no year).'
    Priorities:
      properties:
        water:
          type: number
          minimum: 0.0
          title: Water
          examples:
          - 0.4
        soil:
          type: number
          minimum: 0.0
          title: Soil
          examples:
          - 0.3
        climate:
          type: number
          minimum: 0.0
          title: Climate
          examples:
          - 0.3
      additionalProperties: false
      type: object
      required:
      - water
      - soil
      - climate
      title: Priorities
    RecommendationRequest:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: 'Latitude of one representative point. For a selected area, send one explicitly chosen point;
            results are for that point, never an area or polygon average.'
          examples:
          - 10.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          description: 'Longitude of one representative point. For a selected area, send one explicitly chosen point;
            results are for that point, never an area or polygon average.'
          examples:
          - -84.2
        crops:
          anyOf:
          - items:
              type: string
            type: array
            minItems: 1
          - type: 'null'
          title: Crops
          description: 'Crop ids from GET /crops. Omit for the MVP crops; an empty list is invalid. Ids
            not in GET /crops fail with unknown_crop; they are never substituted.'
        priorities:
          anyOf:
          - $ref: '#/components/schemas/Priorities'
          - type: 'null'
          description: 'Relative importance; normalized to sum 1. Default: MVP weights.'
        top_n:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Top N
        current_rotation:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Current Rotation
          description: 'The farmer''s current rotation: crop ids from GET /crops, one per season, in the
            order of conditions.seasons. Scored as the baseline the other rotations compare to. Omit when
            there is no current crop: no baseline, so current_rotation and score_delta_vs_current are null.
            Ids not in GET /crops fail with unknown_crop; they are never substituted.'
          examples:
          - - maize
            - maize
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      title: RecommendationRequest
    RecommendationResponse:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        region:
          $ref: '#/components/schemas/Region'
        priorities:
          $ref: '#/components/schemas/Priorities'
        conditions:
          $ref: '#/components/schemas/Conditions'
        rotations:
          items:
            $ref: '#/components/schemas/Rotation'
          type: array
          title: Rotations
        current_rotation:
          anyOf:
          - $ref: '#/components/schemas/Rotation'
          - type: 'null'
          description: The farmer's rotation scored the same way; rank is its position among all combinations
            (can be greater than top_n). Null without current_rotation.
        method_version:
          type: string
          title: Method Version
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - location
      - region
      - priorities
      - conditions
      - rotations
      - current_rotation
      - method_version
      - generated_at
      title: RecommendationResponse
    Region:
      properties:
        name:
          type: string
          title: Name
        bbox:
          items:
            type: number
          type: array
          title: Bbox
          description: '[min_lon, min_lat, max_lon, max_lat]'
      additionalProperties: false
      type: object
      required:
      - name
      - bbox
      title: Region
    Rotation:
      properties:
        rank:
          type: integer
          title: Rank
        sequence:
          items:
            $ref: '#/components/schemas/RotationStep'
          type: array
          title: Sequence
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        viable:
          type: boolean
          title: Viable
        breakdown:
          $ref: '#/components/schemas/CategoryBreakdown'
        explanation:
          $ref: '#/components/schemas/LocalizedText'
        is_current:
          type: boolean
          title: Is Current
          description: True if this is the farmer's current_rotation
        score_delta_vs_current:
          anyOf:
          - type: number
          - type: 'null'
          title: Score Delta Vs Current
          description: score minus the current rotation's score; null without current_rotation
        benefits:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Benefits
          description: Why this rotation helps (soil, pests, fit)
        risks:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Risks
          description: What could go wrong; check locally before acting
        data_gaps:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Data Gaps
          description: Missing or approximate data behind this result
        evidence:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Evidence
          description: The data values the score is based on, with sources
        notes:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Notes
          description: 'Deprecated: benefits + risks. Use those instead.'
      additionalProperties: false
      type: object
      required:
      - rank
      - sequence
      - score
      - viable
      - breakdown
      - explanation
      - is_current
      - score_delta_vs_current
      - benefits
      - risks
      - data_gaps
      - evidence
      - notes
      title: Rotation
    RotationStep:
      properties:
        season:
          type: string
          title: Season
        months:
          items:
            type: integer
          type: array
          title: Months
        crop_id:
          type: string
          title: Crop Id
        crop_name:
          type: string
          title: Crop Name
        score:
          type: number
          title: Score
        variable_scores:
          additionalProperties:
            type: number
          type: object
          title: Variable Scores
      additionalProperties: false
      type: object
      required:
      - season
      - months
      - crop_id
      - crop_name
      - score
      - variable_scores
      title: RotationStep
    SeasonSummary:
      properties:
        name:
          type: string
          title: Name
        months:
          items:
            type: integer
          type: array
          title: Months
        temperature_c:
          type: number
          title: Temperature C
        rainfall_mm_per_month:
          type: number
          title: Rainfall Mm Per Month
        temperature_max_c:
          type: number
          title: Temperature Max C
          description: Mean daily maximum temperature over the season, °C (heat stress)
        temperature_min_c:
          type: number
          title: Temperature Min C
          description: Mean daily minimum of the season's coldest month, °C (frost risk)
      additionalProperties: false
      type: object
      required:
      - name
      - months
      - temperature_c
      - rainfall_mm_per_month
      - temperature_max_c
      - temperature_min_c
      title: SeasonSummary
    Soil:
      properties:
        ph:
          type: number
          title: Ph
        moisture_m3m3:
          type: number
          title: Moisture M3M3
          description: Yearly mean root-zone moisture, m³/m³
        moisture_monthly_m3m3:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Moisture Monthly M3M3
          description: Mean root-zone moisture per month (m³/m³), January first; null if unknown
        texture_class:
          anyOf:
          - type: string
          - type: 'null'
          title: Texture Class
          description: USDA texture class of the topsoil (OpenLandMap), e.g. clay; null if unknown
        wetness_monthly:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Wetness Monthly
          description: Mean root-zone relative saturation per month (0 dry .. 1 saturated), January first;
            drives the waterlogging check. Null if unknown
      additionalProperties: false
      type: object
      required:
      - ph
      - moisture_m3m3
      - moisture_monthly_m3m3
      - texture_class
      - wetness_monthly
      title: Soil
    ToleranceRange:
      properties:
        abs_min:
          type: number
          title: Abs Min
        opt_min:
          type: number
          title: Opt Min
        opt_max:
          type: number
          title: Opt Max
        abs_max:
          type: number
          title: Abs Max
      additionalProperties: false
      type: object
      required:
      - abs_min
      - opt_min
      - opt_max
      - abs_max
      title: ToleranceRange
    TraitValue:
      properties:
        level:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          title: Level
          description: Word for the score
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: 0..1, 1 = most
      additionalProperties: false
      type: object
      required:
      - level
      - score
      title: TraitValue
      description: A crop trait as a word for display plus its 0..1 score (e.g. for a hover).
    CropPlanting:
      properties:
        crop_id:
          type: string
          title: Crop Id
        crop_name:
          type: string
          title: Crop Name
        cycle_days:
          type: integer
          title: Cycle Days
        sowing_months:
          items:
            $ref: '#/components/schemas/SowingMonth'
          type: array
          title: Sowing Months
          description: Always 12, January first
        fixed_limits:
          items:
            $ref: '#/components/schemas/LocalizedText'
          type: array
          title: Fixed Limits
          description: Factors that are the same in every month (soil pH) and limit this crop here
        windows:
          items:
            $ref: '#/components/schemas/PlantingWindow'
          type: array
          title: Windows
          description: Consecutive good sowing months; may be empty
      additionalProperties: false
      type: object
      required:
      - crop_id
      - crop_name
      - cycle_days
      - sowing_months
      - fixed_limits
      - windows
      title: CropPlanting
    PlantingWindow:
      properties:
        first_month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: First Month
          description: 'Can wrap: first 11, last 1 = Nov to Jan'
        last_month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Last Month
        best_month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Best Month
        best_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Best Score
      additionalProperties: false
      type: object
      required:
      - first_month
      - last_month
      - best_month
      - best_score
      title: PlantingWindow
    PlantingWindowsResponse:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        crops:
          items:
            $ref: '#/components/schemas/CropPlanting'
          type: array
          title: Crops
          description: One per requested crop id (duplicates ignored), in request order
        data_sources:
          $ref: '#/components/schemas/DataSources'
      additionalProperties: false
      type: object
      required:
      - location
      - crops
      - data_sources
      title: PlantingWindowsResponse
    SowingMonth:
      properties:
        sowing_month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Sowing Month
        months_in_field:
          items:
            type: integer
          type: array
          title: Months In Field
          description: Months the crop spends in the field when sown this month (wraps the year)
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: Same scoring as rotations, 1 = ideal
        is_good:
          type: boolean
          title: Is Good
          description: 'Score on the month-varying variables >= 0.8 and none of them below 0.5 (soil pH is
            the same every month: see fixed_limits). Waterlogging never makes a month not good: see waterlogging_risk'
        dry_month_note:
          anyOf:
          - $ref: '#/components/schemas/LocalizedText'
          - type: 'null'
          description: Why this sowing month fails the dry-month check (a month in the field, harvest excluded,
            gets too little rain to establish and grow); null when it passes
        waterlogging_risk:
          type: boolean
          title: Waterlogging Risk
          description: The root zone is wet enough to warn about waterlogging for this crop (needs good drainage);
            the score already includes a small penalty (at most -15 %)
        limiting_factor:
          anyOf:
          - type: string
          - type: 'null'
          title: Limiting Factor
          description: Lowest-scoring variable (e.g. rainfall) when it is below 1, else null
        variable_scores:
          additionalProperties:
            type: number
          type: object
          title: Variable Scores
      additionalProperties: false
      type: object
      required:
      - sowing_month
      - months_in_field
      - score
      - is_good
      - dry_month_note
      - waterlogging_risk
      - limiting_factor
      - variable_scores
      title: SowingMonth
    LocalizedText:
      properties:
        en:
          type: string
          title: En
        es:
          type: string
          title: Es
      additionalProperties: false
      type: object
      required:
      - en
      - es
      title: LocalizedText
      description: Farmer-facing text in English and Spanish (Costa Rica). Show the one the user picked.
    YearsEvaluated:
      properties:
        first:
          type: integer
          title: First
        last:
          type: integer
          title: Last
        count:
          type: integer
          title: Count
          description: Complete seasons evaluated (sowing years with enough data)
      additionalProperties: false
      type: object
      required:
      - first
      - last
      - count
      title: YearsEvaluated
servers:
- url: http://localhost:8000
  description: Local dev (make dev)
