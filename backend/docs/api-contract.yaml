# API contract (OpenAPI 3.1). Hand-maintained. See info.description.
openapi: 3.1.0
info:
  title: Guardians of the Harvest API
  description: '**DRAFT v0** — contract between backend and frontend. To be reviewed with the frontend.


    This file is the source of truth: change it first, agree on it, then change the code.

    `tests/test_contract.py` fails CI if the running app and this file disagree.


    Errors: every 4xx/5xx returns ErrorResponse `{"error": {code, message, details, request_id}}`. Switch
    on `code` (ErrorCode enum). Full table: backend/docs/errors.md.

    Units: temperature °C, rainfall mm, soil moisture m³/m³, scores 0..1 (1 = ideal).

    Local server: http://localhost:8000 (interactive docs at /docs).'
  version: 0.1.0-draft
paths:
  /health:
    get:
      tags:
      - meta
      summary: Health
      description: Liveness check plus the active data mode and MVP region.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /crops:
    get:
      tags:
      - crops
      summary: List Crops
      description: Crops in the MVP scope, with their tolerance ranges.
      operationId: list_crops_crops_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CropsResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /conditions:
    get:
      tags:
      - conditions
      summary: Get Conditions
      description: Monthly climate normals, per-season summary and soil at a point.
      operationId: get_conditions_conditions_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          examples:
          - 10.0
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          examples:
          - -84.2
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conditions'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recommendations:
    post:
      tags:
      - recommendations
      summary: Create Recommendation
      description: Rank crop rotations for a location given the farmer's priorities.
      operationId: create_recommendation_recommendations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '422':
          description: '`validation_failed`, `out_of_region`, `unknown_crop`, `invalid_priorities`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`internal_error`, `config_invalid`, `domain_invariant`: a backend bug'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`source_unavailable`, `source_bad_data`: an external data source failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`cache_miss`: data_mode=cached and this location was never fetched'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CategoryBreakdown:
      properties:
        climate:
          anyOf:
          - type: number
          - type: 'null'
          title: Climate
        water:
          anyOf:
          - type: number
          - type: 'null'
          title: Water
        soil:
          anyOf:
          - type: number
          - type: 'null'
          title: Soil
      additionalProperties: false
      type: object
      required:
      - climate
      - water
      - soil
      title: CategoryBreakdown
    Conditions:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        monthly:
          items:
            $ref: '#/components/schemas/MonthClimate'
          type: array
          title: Monthly
        seasons:
          items:
            $ref: '#/components/schemas/SeasonSummary'
          type: array
          title: Seasons
        soil:
          $ref: '#/components/schemas/Soil'
        data_sources:
          $ref: '#/components/schemas/DataSources'
      additionalProperties: false
      type: object
      required:
      - location
      - monthly
      - seasons
      - soil
      - data_sources
      title: Conditions
    Crop:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        scientific_name:
          type: string
          title: Scientific Name
        family:
          type: string
          title: Family
        is_legume:
          type: boolean
          title: Is Legume
        cycle_days:
          type: integer
          title: Cycle Days
        temperature_c:
          $ref: '#/components/schemas/ToleranceRange'
        rainfall_mm:
          $ref: '#/components/schemas/ToleranceRange'
          description: Total rainfall over the crop cycle
        soil_ph:
          $ref: '#/components/schemas/ToleranceRange'
        verified:
          type: boolean
          title: Verified
          description: False while values are still approximate
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - scientific_name
      - family
      - is_legume
      - cycle_days
      - temperature_c
      - rainfall_mm
      - soil_ph
      - verified
      title: Crop
    CropsResponse:
      properties:
        crops:
          items:
            $ref: '#/components/schemas/Crop'
          type: array
          title: Crops
      additionalProperties: false
      type: object
      required:
      - crops
      title: CropsResponse
    DataSources:
      properties:
        climate:
          type: string
          title: Climate
        soil:
          type: string
          title: Soil
        crops:
          type: string
          title: Crops
      additionalProperties: false
      type: object
      required:
      - climate
      - soil
      - crops
      title: DataSources
    ErrorBody:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable machine-readable code. Switch on this.
        message:
          type: string
          title: Message
          description: Plain-English explanation, safe to show to users
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Machine-readable context; keys depend on the code
        request_id:
          type: string
          title: Request Id
          description: Same as the X-Request-ID header; quote it in bug reports
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorBody
    ErrorCode:
      type: string
      enum:
      - validation_failed
      - out_of_region
      - unknown_crop
      - invalid_priorities
      - not_found
      - method_not_allowed
      - http_error
      - source_unavailable
      - source_bad_data
      - cache_miss
      - config_invalid
      - domain_invariant
      - internal_error
      title: ErrorCode
      description: Stable machine-readable codes. New code = new class + docs/errors.md row + contract
        enum.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      description: Envelope for EVERY error response (4xx and 5xx). See backend/docs/errors.md.
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        data_mode:
          type: string
          title: Data Mode
        region:
          $ref: '#/components/schemas/Region'
      additionalProperties: false
      type: object
      required:
      - status
      - version
      - data_mode
      - region
      title: HealthResponse
    Location:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - 10.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - -84.2
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      title: Location
    MonthClimate:
      properties:
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        temperature_c:
          type: number
          title: Temperature C
        rainfall_mm:
          type: number
          title: Rainfall Mm
      additionalProperties: false
      type: object
      required:
      - month
      - temperature_c
      - rainfall_mm
      title: MonthClimate
    Priorities:
      properties:
        water:
          type: number
          minimum: 0.0
          title: Water
          examples:
          - 0.4
        soil:
          type: number
          minimum: 0.0
          title: Soil
          examples:
          - 0.3
        climate:
          type: number
          minimum: 0.0
          title: Climate
          examples:
          - 0.3
      additionalProperties: false
      type: object
      required:
      - water
      - soil
      - climate
      title: Priorities
    RecommendationRequest:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - 10.0
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - -84.2
        crops:
          anyOf:
          - items:
              type: string
            type: array
            minItems: 1
          - type: 'null'
          title: Crops
          description: Crop ids from GET /crops. Omit for the MVP crops; an empty list is invalid.
        priorities:
          anyOf:
          - $ref: '#/components/schemas/Priorities'
          - type: 'null'
          description: 'Relative importance; normalized to sum 1. Default: MVP weights.'
        top_n:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Top N
      additionalProperties: false
      type: object
      required:
      - lat
      - lon
      title: RecommendationRequest
    RecommendationResponse:
      properties:
        location:
          $ref: '#/components/schemas/Location'
        region:
          $ref: '#/components/schemas/Region'
        priorities:
          $ref: '#/components/schemas/Priorities'
        conditions:
          $ref: '#/components/schemas/Conditions'
        rotations:
          items:
            $ref: '#/components/schemas/Rotation'
          type: array
          title: Rotations
        method_version:
          type: string
          title: Method Version
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - location
      - region
      - priorities
      - conditions
      - rotations
      - method_version
      - generated_at
      title: RecommendationResponse
    Region:
      properties:
        name:
          type: string
          title: Name
        bbox:
          items:
            type: number
          type: array
          title: Bbox
          description: '[min_lon, min_lat, max_lon, max_lat]'
      additionalProperties: false
      type: object
      required:
      - name
      - bbox
      title: Region
    Rotation:
      properties:
        rank:
          type: integer
          title: Rank
        sequence:
          items:
            $ref: '#/components/schemas/RotationStep'
          type: array
          title: Sequence
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        viable:
          type: boolean
          title: Viable
        breakdown:
          $ref: '#/components/schemas/CategoryBreakdown'
        explanation:
          type: string
          title: Explanation
        notes:
          items:
            type: string
          type: array
          title: Notes
      additionalProperties: false
      type: object
      required:
      - rank
      - sequence
      - score
      - viable
      - breakdown
      - explanation
      - notes
      title: Rotation
    RotationStep:
      properties:
        season:
          type: string
          title: Season
        months:
          items:
            type: integer
          type: array
          title: Months
        crop_id:
          type: string
          title: Crop Id
        crop_name:
          type: string
          title: Crop Name
        score:
          type: number
          title: Score
        variable_scores:
          additionalProperties:
            type: number
          type: object
          title: Variable Scores
      additionalProperties: false
      type: object
      required:
      - season
      - months
      - crop_id
      - crop_name
      - score
      - variable_scores
      title: RotationStep
    SeasonSummary:
      properties:
        name:
          type: string
          title: Name
        months:
          items:
            type: integer
          type: array
          title: Months
        temperature_c:
          type: number
          title: Temperature C
        rainfall_mm_per_month:
          type: number
          title: Rainfall Mm Per Month
      additionalProperties: false
      type: object
      required:
      - name
      - months
      - temperature_c
      - rainfall_mm_per_month
      title: SeasonSummary
    Soil:
      properties:
        ph:
          type: number
          title: Ph
        moisture_m3m3:
          type: number
          title: Moisture M3M3
      additionalProperties: false
      type: object
      required:
      - ph
      - moisture_m3m3
      title: Soil
    ToleranceRange:
      properties:
        abs_min:
          type: number
          title: Abs Min
        opt_min:
          type: number
          title: Opt Min
        opt_max:
          type: number
          title: Opt Max
        abs_max:
          type: number
          title: Abs Max
      additionalProperties: false
      type: object
      required:
      - abs_min
      - opt_min
      - opt_max
      - abs_max
      title: ToleranceRange
servers:
- url: http://localhost:8000
  description: Local dev (make dev)
