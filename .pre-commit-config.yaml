# Early warning on every commit. CI (.github/workflows/ci.yml) is the real gate.
# Install once with: make setup  (or: backend/.venv/bin/pre-commit install)
exclude: ^learning/  # practice material, not product code
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy runs from the backend venv so it sees the real dependencies (pydantic plugin, fastapi…)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/app, strict)
        entry: bash -c 'cd backend && .venv/bin/mypy'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        exclude: ^backend/docs/api-contract\.yaml$  # validated by tests/test_contract.py
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^backend/tests/fixtures/
      - id: trailing-whitespace
        exclude: ^backend/tests/fixtures/
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
